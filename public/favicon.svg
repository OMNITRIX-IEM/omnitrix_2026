<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Dark background container -->
  <rect width="512" height="512" rx="100" fill="#090A0C"/>
  <circle cx="256" cy="256" r="230" fill="#0D0E12" stroke="#1A1C23" stroke-width="4"/>

  <!-- Outer Stylized "O" Tactical Ring -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="#B6FF00" stroke-width="16"/>

  <!-- Notched Accents on Outer Ring -->
  <path d="M 236,65 L 276,65" stroke="#090A0C" stroke-width="22" stroke-linecap="butt"/>
  <path d="M 236,447 L 276,447" stroke="#090A0C" stroke-width="22" stroke-linecap="butt"/>
  <path d="M 65,236 L 65,276" stroke="#090A0C" stroke-width="22" stroke-linecap="butt"/>
  <path d="M 447,236 L 447,276" stroke="#090A0C" stroke-width="22" stroke-linecap="butt"/>

  <!-- Inner Concentric Ring -->
  <circle cx="256" cy="256" r="142" fill="none" stroke="#B6FF00" stroke-width="10" stroke-dasharray="55 15"/>

  <!-- Omnitrix "O" Core Hourglass Emblem -->
  <path d="M 166,166 L 256,256 L 166,346 H 346 L 256,256 L 346,166 Z" fill="#B6FF00"/>

  <!-- Center Core Ring & Dot -->
  <circle cx="256" cy="256" r="40" fill="#090A0C" stroke="#B6FF00" stroke-width="8"/>
  <circle cx="256" cy="256" r="16" fill="#FFFFFF"/>
</svg>
